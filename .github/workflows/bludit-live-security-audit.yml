name: Bludit isolated security audit

on:
  push:
    branches:
      - security-audit/bludit-live-test
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-security-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout isolated audit branch
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gd, mbstring, xml, zip, fileinfo
          coverage: none

      - name: Start disposable Bludit instance
        shell: bash
        run: |
          cat > /tmp/bludit-router.php <<'PHP'
          <?php
          $root = getenv('BLUDIT_ROOT');
          $path = parse_url($_SERVER['REQUEST_URI'], PHP_URL_PATH);
          $file = $root . $path;
          if ($path !== '/' && is_file($file)) {
              return false;
          }
          $_SERVER['DOCUMENT_ROOT'] = $root;
          $_SERVER['SCRIPT_NAME'] = '/index.php';
          $_SERVER['PHP_SELF'] = '/index.php';
          require $root . '/index.php';
          PHP
          export BLUDIT_ROOT="$GITHUB_WORKSPACE"
          php -S 127.0.0.1:8080 -t "$GITHUB_WORKSPACE" /tmp/bludit-router.php >/tmp/bludit-server.log 2>&1 &
          echo $! > /tmp/bludit-server.pid
          for i in $(seq 1 40); do
            if curl -sS http://127.0.0.1:8080/install.php >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS 'http://127.0.0.1:8080/install.php?demo=true' >/dev/null
          test -f bl-content/databases/site.php
          echo "Disposable demo installation created."

      - name: Run live authorization, ownership, upload, session and boundary tests
        shell: bash
        run: bash .github/security-audit/run-live-audit.sh

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bludit-live-security-audit
          path: |
            audit-results.md
            /tmp/bludit-server.log
          if-no-files-found: warn
