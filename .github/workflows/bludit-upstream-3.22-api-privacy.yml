name: Bludit upstream 3.22.0 API privacy verification
on:
  push:
    branches:
      - security-audit/bludit-live-test
  workflow_dispatch:
permissions:
  contents: read
jobs:
  api-privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bludit/bludit
          ref: 3.22.0
          path: bludit
      - uses: actions/checkout@v4
        with:
          repository: brx-zyy/bludit
          ref: security-audit/bludit-live-test
          path: audit-harness
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gd, mbstring, xml, zip, fileinfo
          coverage: none
      - name: Start upstream disposable instance
        shell: bash
        working-directory: bludit
        run: |
          cat >/tmp/router.php <<'PHP'
          <?php
          $root = getenv('BLUDIT_ROOT');
          $path = parse_url($_SERVER['REQUEST_URI'], PHP_URL_PATH);
          if ($path !== '/' && is_file($root . $path)) return false;
          $_SERVER['DOCUMENT_ROOT'] = $root;
          $_SERVER['SCRIPT_NAME'] = '/index.php';
          $_SERVER['PHP_SELF'] = '/index.php';
          require $root . '/index.php';
          PHP
          export BLUDIT_ROOT="$GITHUB_WORKSPACE/bludit"
          php -S 127.0.0.1:8080 -t "$GITHUB_WORKSPACE/bludit" /tmp/router.php >/tmp/upstream-bludit.log 2>&1 &
          for i in $(seq 1 40); do
            curl -sS http://127.0.0.1:8080/install.php >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS 'http://127.0.0.1:8080/install.php?demo=true' >/dev/null
          test -f bl-content/databases/site.php
      - name: Run corrected API confidentiality probes against upstream
        shell: bash
        working-directory: bludit
        run: |
          set -euo pipefail
          python3 - <<'PY'
          p = '../audit-harness/.github/security-audit/run-live-audit.sh'
          s = open(p, encoding='utf-8').read()
          s = s.replace('audit-owner', 'auditowner').replace('audit-attacker', 'auditattacker')
          s = s.replace('PHPSESSID', 'BLUDIT-KEY')
          old = '"' + '$' + '{AUTH[@]}" "' + '$' + '{ADMIN_HEADERS[@]:1}"'
          new = '"' + '$' + '{ADMIN_HEADERS[@]}"'
          s = s.replace(old, new)
          s = s.replace('if [[ "$code" == "302" || "$code" == "200" ]]; then', 'if [[ "$code" == "301" || "$code" == "302" ]]; then')
          s = s.replace('if [[ "$CODE" == "302" || "$CODE" == "401" ]]; then', 'if [[ "$CODE" == "301" || "$CODE" == "302" || "$CODE" == "401" ]]; then')
          open('/tmp/run-upstream-audit.sh', 'w', encoding='utf-8').write(s)
          PY
          bash /tmp/run-upstream-audit.sh
      - name: Upload upstream evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bludit-upstream-3.22.0-api-privacy-evidence
          path: |
            bludit/audit-results.md
            /tmp/upstream-bludit.log
          if-no-files-found: warn
