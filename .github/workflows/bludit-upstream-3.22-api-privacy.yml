name: Bludit upstream 3.22.0 API privacy verification
on:
  push:
    branches:
      - security-audit/bludit-live-test
  workflow_dispatch:
permissions:
  contents: read
jobs:
  api-privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bludit/bludit
          ref: 3.22.0
          path: bludit
      - uses: actions/checkout@v4
        with:
          repository: brx-zyy/bludit
          ref: security-audit/bludit-live-test
          path: audit-harness
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gd, mbstring, xml, zip, fileinfo
          coverage: none
      - name: Start upstream disposable instance
        shell: bash
        working-directory: bludit
        run: |
          cat >/tmp/router.php <<'PHP'
          <?php
          $root = getenv('BLUDIT_ROOT');
          $path = parse_url($_SERVER['REQUEST_URI'], PHP_URL_PATH);
          if ($path !== '/' && is_file($root . $path)) return false;
          $_SERVER['DOCUMENT_ROOT'] = $root;
          $_SERVER['SCRIPT_NAME'] = '/index.php';
          $_SERVER['PHP_SELF'] = '/index.php';
          require $root . '/index.php';
          PHP
          export BLUDIT_ROOT="$GITHUB_WORKSPACE/bludit"
          php -S 127.0.0.1:8080 -t "$GITHUB_WORKSPACE/bludit" /tmp/router.php >/tmp/upstream-bludit.log 2>&1 &
          for i in $(seq 1 40); do
            curl -sS http://127.0.0.1:8080/install.php >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS 'http://127.0.0.1:8080/install.php?demo=true' >/dev/null
          test -f bl-content/databases/site.php
      - name: Verify documented API token behavior against upstream
        shell: bash
        working-directory: bludit
        run: |
          set -euo pipefail
          jar=/tmp/upstream-admin.cookies
          curl -sS -c "$jar" -b "$jar" "$BASE/admin/login" -o /tmp/upstream-login.html
          csrf="$(python3 - <<'PY'
          import re
          s=open('/tmp/upstream-login.html', encoding='utf-8', errors='ignore').read()
          m=re.search(r'var\\s+tokenCSRF\\s*=\\s*["\\']([^"\\']+)["\\']', s)
          print(m.group(1) if m else '')
          PY
          )"
          test -n "$csrf" || { echo 'CSRF token was not found in Bludit JavaScript variables'; exit 1; }
          login_code="$(curl -sS -o /tmp/upstream-login-post.html -w '%{http_code}' -c "$jar" -b "$jar" -X POST --data-urlencode 'username=admin' --data-urlencode 'password=demo123' --data-urlencode "tokenCSRF=$csrf" "$BASE/admin/login")"
          echo "Admin login HTTP: $login_code"
          test "$login_code" = 301 || test "$login_code" = 302
          api="$(curl -sS -b "$jar" "$BASE/admin/api")"
          token="$(printf '%s' "$api" | jq -r '.apiToken // empty')"
          auth="$(printf '%s' "$api" | jq -r '.authToken // empty')"
          test -n "$token" && test -n "$auth"
          marker='AUDIT_EXPECTED_DRAFT_3f81a9'
          body="$(jq -n --arg token "$token" --arg authentication "$auth" --arg title "$marker" '{token:$token,authentication:$authentication,title:$title,content:"synthetic API behavior check",type:"draft"}')"
          create_code="$(curl -sS -o /tmp/upstream-create.json -w '%{http_code}' -H 'Content-Type: application/json' -d "$body" "$BASE/api/pages")"
          echo "Create draft HTTP: $create_code"
          cat /tmp/upstream-create.json
          test "$create_code" = 201 || test "$create_code" = 200
          key="$(jq -r '.data.key // empty' /tmp/upstream-create.json)"
          test -n "$key"
          list_code="$(curl -sS -o /tmp/upstream-list.json -w '%{http_code}' "$BASE/api/pages?token=$token&published=false&draft=true")"
          direct_code="$(curl -sS -o /tmp/upstream-direct.json -w '%{http_code}' "$BASE/api/pages/$key?token=$token")"
          echo "Read-only list HTTP: $list_code; direct read HTTP: $direct_code"
          test "$list_code" = 200 && test "$direct_code" = 200
          jq -e --arg marker "$marker" '.data[]? | select(.title == $marker)' /tmp/upstream-list.json >/dev/null
          jq -e --arg marker "$marker" '.data.title == $marker' /tmp/upstream-direct.json >/dev/null
          echo 'EXPECTED: documented read-only API token can list and fetch draft pages.'
          settings_code="$(curl -sS -o /tmp/upstream-settings-readonly.json -w '%{http_code}' "$BASE/api/settings?token=$token")"
          echo "Settings without authentication token HTTP: $settings_code"
          test "$settings_code" = 401
          settings_admin_code="$(curl -sS -o /tmp/upstream-settings-admin.json -w '%{http_code}' "$BASE/api/settings?token=$token&authentication=$auth")"
          echo "Settings with admin authentication token HTTP: $settings_admin_code"
          test "$settings_admin_code" = 200
      - name: Upload upstream evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bludit-upstream-3.22.0-api-privacy-evidence
          path: |
            /tmp/upstream-bludit.log
            /tmp/upstream-login.html
            /tmp/upstream-login-post.html
            /tmp/upstream-create.json
            /tmp/upstream-list.json
            /tmp/upstream-direct.json
            /tmp/upstream-settings-readonly.json
            /tmp/upstream-settings-admin.json
          if-no-files-found: warn
